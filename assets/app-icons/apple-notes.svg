<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Apple Notizen">
  <!-- Apple Notes app icon: yellow header + lined notepad -->
  <defs>
    <linearGradient id="notesYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE56A"/>
      <stop offset="55%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#E8B000"/>
    </linearGradient>
    <linearGradient id="notesPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F2F4"/>
    </linearGradient>
    <clipPath id="notesClip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#notesClip)">
    <rect width="64" height="64" rx="14" fill="url(#notesPaper)"/>
    <rect width="64" height="18" fill="url(#notesYellow)"/>
    <rect y="16.5" width="64" height="2.2" fill="#E0A800" opacity="0.55"/>
    <!-- notepad lines -->
    <line x1="12" y1="30" x2="52" y2="30" stroke="#C8C8CE" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="12" y1="39.5" x2="52" y2="39.5" stroke="#C8C8CE" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="12" y1="49" x2="52" y2="49" stroke="#C8C8CE" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="12" y1="58.5" x2="40" y2="58.5" stroke="#C8C8CE" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
