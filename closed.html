<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>ASAS</title>
    <link rel="icon" href="/favicon.ico?v=5" sizes="any">
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
    <style>
        :root {
            --site-glass-header-bar: 118px;
            --page-bg: #000000;
            --hero-headline-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--page-bg);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: calc(env(safe-area-inset-top, 0px) + var(--site-glass-header-bar));
            background: var(--page-bg);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .animated_bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #090c22ba 0%, #0c0d13 100%);
            opacity: 0.5;
        }

        .site-glass-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10050;
            pointer-events: none;
            padding-top: env(safe-area-inset-top, 0px);
        }

        .site-glass-header__inner {
            width: 100%;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background: rgba(0, 0, 0, 0.18);
            -webkit-backdrop-filter: blur(72px) saturate(1.15);
            backdrop-filter: blur(72px) saturate(1.15);
            box-shadow:
                inset 0 0 48px rgba(70, 72, 80, 0.11),
                inset 0 -1px 0 rgba(0, 0, 0, 0.48),
                0 5px 20px rgba(14, 14, 18, 0.16);
        }

        .site-glass-header__row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: var(--site-glass-header-bar);
            padding: 28px max(20px, env(safe-area-inset-right, 0px)) 34px max(24px, calc(env(safe-area-inset-left, 0px) + 18px));
        }

        .site-glass-header__brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .site-glass-header__logo {
            height: 44px;
            width: auto;
            max-width: min(158px, 38vw);
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        .site-glass-header__wordmark {
            height: 26px;
            width: auto;
            max-width: min(240px, 42vw);
            object-fit: contain;
            object-position: left center;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
        }

        .site-glass-header__desktop-nav {
            display: none;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 1.8vw, 24px);
            flex: 1 1 auto;
        }

        .site-glass-header__navlink {
            color: rgba(240, 244, 255, 0.72);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            white-space: nowrap;
            padding: 6px 2px;
        }

        .site-glass-header__actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .site-glass-header__menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: rgba(255, 255, 255, 0.88);
        }

        .site-glass-header__menu-bars {
            position: relative;
            width: 22px;
            height: 16px;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
        }

        .site-glass-header__menu-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            border-radius: 1px;
            background: currentColor;
        }

        .site-glass-header__menu-bar:nth-child(1) { top: 1px; }
        .site-glass-header__menu-bar:nth-child(2) { top: 7px; }
        .site-glass-header__menu-bar:nth-child(3) { top: 13px; }

        .btn {
            font-family: var(--hero-headline-font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: default;
        }

        .site-glass-header__cta {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 650;
            letter-spacing: -0.01em;
            color: #ffffff;
            border: 1.5px solid rgba(108, 156, 255, 0.58);
            background:
                radial-gradient(130% 170% at 50% 0%, rgba(72, 130, 255, 0.44) 0%, transparent 54%),
                linear-gradient(180deg, rgba(34, 58, 124, 0.98) 0%, rgba(16, 28, 68, 0.99) 46%, rgba(8, 14, 38, 0.99) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 0 1px rgba(61, 106, 255, 0.18),
                0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .cta-lock-icon {
            display: flex;
            flex-shrink: 0;
            margin-left: -2px;
            line-height: 0;
        }

        .cta-lock-icon svg {
            display: block;
            width: 15px;
            height: auto;
        }

        .closed-page {
            position: relative;
            z-index: 1;
            min-height: calc(100dvh - env(safe-area-inset-top, 0px) - var(--site-glass-header-bar));
            display: flex;
            flex-direction: column;
        }

        .closed-shell {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: min(68vh, calc(100dvh - env(safe-area-inset-top, 0px) - var(--site-glass-header-bar) - 120px));
            padding:
                clamp(24px, 6vh, 48px) max(24px, env(safe-area-inset-left, 0px))
                clamp(16px, 3vh, 28px)
                max(24px, env(safe-area-inset-right, 0px));
        }

        .closed-inner {
            width: min(720px, 100%);
            text-align: center;
            will-change: transform;
            animation: closed-float 7.5s ease-in-out infinite;
            filter: drop-shadow(0 22px 54px rgba(0, 0, 0, 0.42));
        }

        @keyframes closed-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .closed-title {
            font-family: var(--hero-headline-font);
            font-size: clamp(28px, 8vw, 56px);
            font-weight: 600;
            letter-spacing: -0.032em;
            line-height: 1.1;
            color: #ffffff;
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.22),
                0 14px 36px rgba(0, 0, 0, 0.38);
        }

        .closed-note {
            margin: 18px auto 0;
            max-width: 28rem;
            font-family: var(--hero-headline-font);
            font-size: clamp(0.95rem, 1.7vw, 1.05rem);
            line-height: 1.55;
            font-weight: 400;
            color: rgba(190, 200, 220, 0.8);
        }

        .closed-footer {
            flex-shrink: 0;
            margin-top: auto;
            opacity: 0.72;
        }

        .footer-divider {
            width: min(720px, calc(100% - 48px));
            height: 1px;
            margin: 0 auto;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), rgba(96,165,250,0.14), rgba(255,255,255,0.12), transparent);
            opacity: 0.35;
        }

        .site-footer {
            position: relative;
            z-index: 5;
            margin-top: 12px;
            padding: 0 max(16px, env(safe-area-inset-left, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 24px;
            align-items: end;
            width: 100%;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .footer-col--legal {
            margin-left: 0;
        }

        .footer-col--meta {
            justify-self: end;
            align-items: flex-end;
            text-align: right;
        }

        .footer-link,
        .footer-text {
            font-size: 11px;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.34);
            letter-spacing: 0.01em;
        }

        a.footer-link {
            text-decoration: none;
            transition: color 0.22s ease;
        }

        a.footer-link:hover,
        a.footer-link:focus-visible {
            color: rgba(215, 228, 255, 0.72);
            outline: none;
        }

        .footer-legal-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .footer-brand-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            width: 52px;
            transform: none;
            opacity: 0.7;
        }

        .footer-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 52px;
        }

        .footer-brand__symbol {
            width: 12px;
            height: auto;
            display: block;
        }

        .footer-brand__wordmark {
            width: 44px;
            height: auto;
            display: block;
        }

        .footer-kreislogo {
            width: 46px;
            height: auto;
            display: block;
            transform: none;
            opacity: 0.72;
        }

        .footer-legal-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            align-items: center;
        }

        .footer-social-links {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .footer-social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
        }

        .footer-social-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @media (max-width: 768px) {
            :root {
                --site-glass-header-bar: 100px;
            }

            body {
                padding-top: calc(env(safe-area-inset-top, 0px) + var(--site-glass-header-bar));
            }

            .site-glass-header__inner {
                -webkit-backdrop-filter: blur(64px) saturate(1.12);
                backdrop-filter: blur(64px) saturate(1.12);
                background: rgba(0, 0, 0, 0.28);
            }

            .site-glass-header__row {
                min-height: var(--site-glass-header-bar);
                padding: 22px max(16px, env(safe-area-inset-right, 0px)) 26px max(18px, calc(env(safe-area-inset-left, 0px) + 14px));
            }

            .site-glass-header__logo {
                height: 38px;
                max-width: min(132px, 42vw);
            }

            .site-glass-header__wordmark {
                height: 22px;
                max-width: min(200px, 48vw);
            }

            .site-glass-header__brand {
                gap: 8px;
            }

            .closed-shell {
                min-height: min(72vh, calc(100dvh - env(safe-area-inset-top, 0px) - var(--site-glass-header-bar) - 96px));
            }

            .footer-divider {
                width: min(560px, calc(100% - 32px));
            }

            .site-footer {
                margin-top: 8px;
                padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
                grid-template-columns: 1fr;
                gap: 8px;
                text-align: center;
                justify-items: center;
            }

            .footer-col--meta {
                justify-self: center;
                align-items: center;
                text-align: center;
            }

            .footer-legal-wrap {
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }

            .footer-brand__symbol {
                display: none;
            }

            .footer-brand {
                justify-content: center;
                gap: 0;
            }

            .footer-legal-links {
                justify-content: center;
            }
        }

        @media (min-width: 961px) {
            .site-glass-header__desktop-nav,
            .site-glass-header__cta {
                display: flex;
            }

            .site-glass-header__menu-toggle {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            .closed-footer,
            .site-footer {
                width: min(920px, calc(100% - 64px));
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .closed-inner {
                animation: none !important;
                filter: none !important;
            }

            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="animated_bg" aria-hidden="true"></div>

    <header class="site-glass-header" role="banner" aria-hidden="true">
        <div class="site-glass-header__inner">
            <div class="site-glass-header__row">
                <div class="site-glass-header__brand" aria-hidden="true">
                    <img src="/ASAS_Symbol.svg" alt="" class="site-glass-header__logo" width="370" height="400" decoding="async">
                    <img src="/ASAS_Text_white.svg" alt="" class="site-glass-header__wordmark" width="662" height="127" decoding="async">
                </div>

                <nav class="site-glass-header__desktop-nav" aria-hidden="true">
                    <span class="site-glass-header__navlink">Ablauf</span>
                    <span class="site-glass-header__navlink">Ränge</span>
                    <span class="site-glass-header__navlink">Zugang</span>
                    <span class="site-glass-header__navlink">FAQ</span>
                </nav>

                <div class="site-glass-header__actions" aria-hidden="true">
                    <span class="btn site-glass-header__cta">
                        <span class="cta-lock-icon" aria-hidden="true">
                            <svg width="18" height="22" viewBox="0 0 18 22" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="10" width="14" height="12" rx="2.5" fill="white"/><circle cx="9" cy="16" r="1.8" fill="#1c2f6a"/><g class="shackle"><path d="M5.5 10V7a3.5 3.5 0 0 1 7 0v3" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/></g></svg>
                        </span>
                        <span>ASAS starten</span>
                    </span>
                    <span class="site-glass-header__menu-toggle" aria-hidden="true">
                        <span class="site-glass-header__menu-bars" aria-hidden="true">
                            <span class="site-glass-header__menu-bar"></span>
                            <span class="site-glass-header__menu-bar"></span>
                            <span class="site-glass-header__menu-bar"></span>
                        </span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <div class="closed-page">
        <main class="closed-shell">
            <div class="closed-inner">
                <h1 class="closed-title">ASAS hat sich weiterentwickelt und ist momentan geschlossen.</h1>
                <p class="closed-note">Du hast aktuell keine Möglichkeit, Zugang zu erhalten.</p>
            </div>
        </main>

        <div class="closed-footer">
        <div class="footer-divider" aria-hidden="true"></div>

        <footer class="site-footer" aria-label="Website Footer">
            <div class="footer-col footer-col--legal" aria-label="Rechtliche Links">
                <div class="footer-legal-wrap">
                    <div class="footer-brand-stack">
                        <div class="footer-brand" aria-hidden="true">
                            <img src="/ASAS_Symbol.svg" alt="" class="footer-brand__symbol" width="20" height="21" decoding="async">
                            <img src="/ASAS_Text_white.svg" alt="" class="footer-brand__wordmark" width="82" height="16" decoding="async">
                        </div>
                        <img src="/asas_logo_vector.svg" alt="" class="footer-kreislogo" width="114" height="114" decoding="async">
                    </div>
                    <div class="footer-legal-links">
                        <a class="footer-link" href="/impressum">Impressum</a>
                        <a class="footer-link" href="/datenschutz">Datenschutz</a>
                        <a class="footer-link" href="/agb">AGB</a>
                        <a class="footer-link" href="/widerruf">Widerrufsrecht</a>
                    </div>
                </div>
            </div>

            <div class="footer-col footer-col--meta" aria-label="Kontakt und Copyright">
                <div class="footer-social-links" aria-hidden="true">
                    <span class="footer-link">
                        <span class="footer-social-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5.25" stroke="currentColor" stroke-width="1.8"/>
                                <circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="1.8"/>
                                <circle cx="17.55" cy="6.45" r="1.2" fill="currentColor"/>
                            </svg>
                        </span>
                    </span>
                    <span class="footer-link">
                        <span class="footer-social-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16.6 4.2c.8 1.1 1.9 1.9 3.2 2.3v2.7a8.3 8.3 0 0 1-3.1-.9v6.1a5.4 5.4 0 1 1-4.7-5.4v2.8a2.7 2.7 0 1 0 2 2.6V2.2h2.6c0 .7.2 1.4.6 2z"/>
                            </svg>
                        </span>
                    </span>
                </div>
                <span class="footer-text">&copy; 2026 ASAS</span>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
